name: Party

# romini.party and www serve one static page. The zone must already exist
# (edge-dns) before the custom domains attach.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/party/**'
      - '.github/workflows/party.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy page
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://romini.party
    concurrency:
      group: romini-party-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Party deploy needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/party/package-lock.json

      - name: Install worker dependencies
        working-directory: deploy/party
        run: npm ci

      - name: Deploy
        working-directory: deploy/party
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
