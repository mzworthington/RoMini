name: Party

# romini.party and www serve one static page. The zone must already exist
# (edge-dns) before the custom domains attach.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/party/**'
      - '.github/workflows/party.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/party/package-lock.json

      - name: Install worker dependencies
        working-directory: deploy/party
        run: npm ci

      - name: Deploy
        working-directory: deploy/party
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set. Skipping wrangler deploy."
            exit 0
          fi
          npx wrangler deploy
