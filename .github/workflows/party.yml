name: Party

# romini.party and www serve one static page. The zone must already exist
# (edge-dns) before the custom domains attach.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/party/**'
      - '.github/workflows/party.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy page
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://romini.party
    concurrency:
      group: romini-party-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Party deploy needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/party/package-lock.json

      - name: Install worker dependencies
        working-directory: deploy/party
        run: npm ci

      - name: Bake PostHog config
        working-directory: deploy/party
        env:
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
          POSTHOG_HOST: https://a.mzworthington.co.uk
        run: |
          if [ -z "${POSTHOG_TOKEN}" ]; then
            echo "::warning::POSTHOG_TOKEN is unset. romini.party will skip PostHog until the secret exists."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          host = os.environ.get("POSTHOG_HOST", "").strip() or "https://a.mzworthington.co.uk"
          Path("public/posthog-config.json").write_text(
              json.dumps({"enabled": True, "apiKey": os.environ["POSTHOG_TOKEN"].strip(), "apiHost": host}) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Deploy
        working-directory: deploy/party
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
