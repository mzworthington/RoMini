name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install mise
        uses: jdx/mise-action@v4.3.0

      - name: Bootstrap
        run: make bootstrap

      - name: Pre-commit
        run: .venv/bin/pre-commit run --all-files

      - name: Test
        run: make test

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6.5.0
        with:
          report_paths: junit/test-results.xml
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Verify"
            echo "- sha: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect application changes since last release
        id: changes
        uses: mzworthington/dotfiles/.github/actions/detect-release-changes@main
        with:
          paths: |
            src/
            pyproject.toml

      - name: Install mise
        if: steps.changes.outputs.release == 'true'
        uses: jdx/mise-action@v4.3.0

      - name: Bootstrap
        if: steps.changes.outputs.release == 'true'
        run: make bootstrap

      - name: Release
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git describe --tags --match 'v*' >/dev/null 2>&1; then
            VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            git tag "v${VERSION}"
            echo "Seeded baseline tag v${VERSION} from pyproject.toml"
          fi
          print_log="$(.venv/bin/semantic-release version --print 2>&1 || true)"
          printf '%s\n' "$print_log"
          if printf '%s\n' "$print_log" | grep -qiE 'No release will be made|No release will be created'; then
            echo "No semantic-release version to cut; skipping publish."
            exit 0
          fi
          .venv/bin/semantic-release version
          git fetch origin main
          git pull --ff-only origin main
          .venv/bin/semantic-release publish
