name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: Cut a GitHub Release even if path detect would skip
        type: boolean
        default: false
      force_level:
        description: Semver bump when forcing (from the highest v* tag)
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify
        uses: mzworthington/dotfiles/.github/actions/python-mise-verify@main
        with:
          pre-commit: 'true'

      - name: Party routes
        run: node --test deploy/party/src/landing.test.js

      - name: Summary
        if: always()
        run: |
          {
            echo "## Verify"
            echo "- sha: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Detect application changes since last release
        if: github.event.inputs.force_release != 'true'
        id: changes
        uses: mzworthington/dotfiles/.github/actions/detect-release-changes@main
        with:
          paths: |
            src/
            pyproject.toml

      - name: Install mise
        if: github.event.inputs.force_release == 'true' || steps.changes.outputs.release == 'true'
        uses: jdx/mise-action@v5.2.2

      - name: Bootstrap
        if: github.event.inputs.force_release == 'true' || steps.changes.outputs.release == 'true'
        run: make bootstrap

      - name: Release
        if: github.event.inputs.force_release == 'true' || steps.changes.outputs.release == 'true'
        uses: mzworthington/dotfiles/.github/actions/python-semantic-release@main
        with:
          force-level: ${{ github.event.inputs.force_release == 'true' && github.event.inputs.force_level || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-demo:
    name: Deploy demo
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://demo.romini.party
    concurrency:
      group: romini-demo-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Demo deploy needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.13'
          working-directory: deploy/demo

      - name: Install demo dependencies
        working-directory: deploy/demo
        run: uv sync --frozen

      - name: Apply D1 migrations
        working-directory: deploy/demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler d1 migrations apply romini-demo --remote

      - name: Deploy demo Worker
        working-directory: deploy/demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
          POSTHOG_HOST: https://a.mzworthington.co.uk
        run: |
          if [ -n "${POSTHOG_TOKEN}" ]; then
            printf '%s' "${POSTHOG_TOKEN}" | uv run pywrangler secret put POSTHOG_TOKEN
          else
            echo "::warning::POSTHOG_TOKEN is unset. The demo will skip PostHog until the secret exists."
          fi
          uv run pywrangler deploy
