name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify
        uses: mzworthington/dotfiles/.github/actions/python-mise-verify@main
        with:
          pre-commit: 'true'

      - name: Summary
        if: always()
        run: |
          {
            echo "## Verify"
            echo "- sha: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect application changes since last release
        id: changes
        uses: mzworthington/dotfiles/.github/actions/detect-release-changes@main
        with:
          paths: |
            src/
            pyproject.toml

      - name: Install mise
        if: steps.changes.outputs.release == 'true'
        uses: jdx/mise-action@v4.3.0

      - name: Bootstrap
        if: steps.changes.outputs.release == 'true'
        run: make bootstrap

      - name: Release
        if: steps.changes.outputs.release == 'true'
        uses: mzworthington/dotfiles/.github/actions/python-semantic-release@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
