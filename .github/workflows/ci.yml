name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: Cut a GitHub Release even if path detect would skip
        type: boolean
        default: false
      force_level:
        description: Semver bump when forcing (from the highest v* tag)
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify
        uses: mzworthington/dotfiles/.github/actions/python-mise-verify@main
        with:
          pre-commit: 'true'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_API_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.organization=${{ vars.SONARQUBE_ORG }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Verify"
            echo "- sha: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Detect application changes since last release
        if: github.event.inputs.force_release != 'true'
        id: changes
        uses: mzworthington/dotfiles/.github/actions/detect-release-changes@main
        with:
          paths: |
            src/
            pyproject.toml

      - name: Install mise
        if: github.event.inputs.force_release == 'true' || steps.changes.outputs.release == 'true'
        uses: jdx/mise-action@v4.3.0

      - name: Bootstrap
        if: github.event.inputs.force_release == 'true' || steps.changes.outputs.release == 'true'
        run: make bootstrap

      - name: Release
        if: github.event.inputs.force_release == 'true' || steps.changes.outputs.release == 'true'
        uses: mzworthington/dotfiles/.github/actions/python-semantic-release@main
        with:
          force-level: ${{ github.event.inputs.force_release == 'true' && github.event.inputs.force_level || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
