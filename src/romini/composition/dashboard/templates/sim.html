<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoMini sim</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>{{ css }}</style>
</head>
<body>
<main>
<header class="masthead">
<img class="mark" src="/mark.svg" width="112" height="112" alt="">
<div>
<h1>Ro<span>Mini</span></h1>
<p class="tag">Sim</p>
<p class="lede">Place or tap a figure and press the box from this page</p>
</div>
</header>
<section>
<h2>Figure on the plate</h2>
<label for="nfc-uid">NFC tag</label>
<input id="nfc-uid" name="uid" type="text" autocomplete="off" spellcheck="false">
<p class="hint">Paste a UID, then put it on the plate or tap it.</p>
<div class="plate">
<input id="nfc-present" type="checkbox">
<label for="nfc-present">On plate</label>
<button type="button" id="nfc-tap">Tap</button>
</div>
</section>
<section>
<h2>Box buttons</h2>
<div class="controls">
<form method="post" action="/vol/down" data-inject><button>Quieter</button></form>
<form method="post" action="/vol/up" data-inject><button>Louder</button></form>
<form method="post" action="/play" data-inject><button>Play</button></form>
<form method="post" action="/halt" data-inject><button>Halt</button></form>
<form method="post" action="/remove" data-inject><button>Lift</button></form>
</div>
</section>
<details class="injectors">
<summary>HTTP injectors</summary>
<p>POST /place/&lt;uid&gt; /tap/&lt;uid&gt; /remove /vol/up /vol/down /play /halt</p>
</details>
</main>
<script>
document.getElementById('nfc-present').addEventListener('change',function(){
var uid=document.getElementById('nfc-uid').value.trim();
if(this.checked&&!uid){this.checked=false;return;}
fetch(this.checked?'/place/'+encodeURIComponent(uid):'/remove',{method:'POST'});
});
document.getElementById('nfc-tap').addEventListener('click',function(){
var uid=document.getElementById('nfc-uid').value.trim();
if(!uid){return;}
var plate=document.getElementById('nfc-present');
if(plate.checked){plate.checked=false;return;}
fetch('/tap/'+encodeURIComponent(uid),{method:'POST'});
});
document.querySelectorAll('form[data-inject]').forEach(function(form){
form.addEventListener('submit',function(e){
e.preventDefault();
fetch(form.action,{method:'POST'});
});
});
</script>
</body>
</html>
