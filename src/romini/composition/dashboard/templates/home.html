{% extends "layout.html" %}
{% block content %}
<div class="page-head">
<div>
<p class="page-kicker">Live deck console</p>
<h2 class="page-title">Live Player</h2>
<p class="lede">Real-time RoMini Box insight.</p>
</div>
</div>
{% include "deck.html" %}
<script>
{% include "live_player.js" %}
if (!window.__rominiHalo) {
window.__rominiHalo = true;
document.addEventListener("click", function (event) {
  var button = event.target.closest("[data-halo]");
  if (!button) return;
  document.querySelectorAll("[data-halo]").forEach(function (other) {
    other.setAttribute("aria-pressed", other === button ? "true" : "false");
  });
  var level = document.getElementById("halo-level");
  if (level) level.textContent = button.getAttribute("data-halo");
  try { localStorage.setItem("romini-halo", button.getAttribute("data-halo")); } catch (e) {}
});
}
</script>
{% endblock %}
