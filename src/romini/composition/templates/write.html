{% extends "layout.html" %}
{% block content %}
<section>
<h2>Write a story</h2>
<form action="/stories" method="post" enctype="multipart/form-data">
<label for="story-title">Story title</label>
<input id="story-title" name="story_title" type="text" value="{{ story_title }}">
<label for="characters">Characters</label>
<textarea id="characters" name="characters">{{ characters }}</textarea>
<label for="interests">Points to cover / interests</label>
<textarea id="interests" name="interests">{{ interests }}</textarea>
<label for="outline">Story outline</label>
<textarea id="outline" name="outline">{{ outline }}</textarea>
<label for="script">Script</label>
<textarea id="script" name="script">{{ script }}</textarea>
<label for="extra">Extra files</label>
<input id="extra" type="file" name="extra">
{% if extras %}
<ul>
{% for name in extras %}
<li>{{ name }} <button name="remove_extra" value="{{ name }}">Remove</button></li>
{% endfor %}
</ul>
{% endif %}
<button>Save story</button>
</form>
{% if spoken_file %}
<p class="hint">Spoken file: {{ spoken_file }}</p>
{% endif %}
<form action="/stories/draft" method="post">
<button>Draft script</button>
</form>
<form action="/stories/speak" method="post">
<button>Speak script</button>
</form>
</section>
{% endblock %}
