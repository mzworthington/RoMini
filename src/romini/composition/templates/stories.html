{% extends "layout.html" %}
{% block content %}
<section>
<h2>Saved stories</h2>
{% if saved_stories %}
<ul class="jumps">
{% for story in saved_stories %}
<li>
<form action="/stories/open" method="post">
<button class="jump" name="slug" value="{{ story.slug }}">
<strong>{{ story.title }}</strong>
Open {{ story.title }}
</button>
</form>
</li>
{% endfor %}
</ul>
{% else %}
<p class="empty">No saved stories yet</p>
{% endif %}
<ul class="jumps">
<li><a href="/write"><strong>Write</strong> Start a new story pack.</a></li>
</ul>
</section>
{% endblock %}
