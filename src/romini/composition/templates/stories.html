{% extends "layout.html" %}
{% block content %}
<section>
<h2>Saved stories</h2>
{% if saved_stories %}
<ul>
{% for story in saved_stories %}
<li>
<form action="/stories/open" method="post">
<button name="slug" value="{{ story.slug }}">Open {{ story.title }}</button>
</form>
</li>
{% endfor %}
</ul>
{% else %}
<p class="empty">No saved stories yet</p>
{% endif %}
<p class="hint"><a href="/write">Write a new story</a></p>
</section>
{% endblock %}
