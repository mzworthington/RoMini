[project]
name = "romini-demo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<1",
    "jinja2>=3.1.0,<4",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0.3,<7",
    "starlette>=1.7.0,<2",
    "romini",
]

[tool.uv.sources]
romini = { path = "../.." }

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
