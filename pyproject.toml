[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romini"
version = "0.37.0"
description = "Screen-free NFC audio player for Raspberry Pi"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Matthew Worthington" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "jinja2>=3.1.0,<4",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0.3,<7",
    "uvicorn>=0.32.0,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.6.0",
    "httpx>=0.28.0",
    "pre-commit>=4.6.2",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "python-semantic-release>=10.6.2",
    "ruff>=0.16.6",
]
screenshots = [
    "playwright>=1.49",
]

[project.scripts]
romini-core = "romini.__main__:entry"

[tool.setuptools.packages.find]
where = ["src"]
include = ["romini", "romini.*"]

[tool.setuptools.package-data]
romini = ["*.wav", "assets/*.svg", "assets/*.woff2", "composition/dashboard/templates/*", "composition/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["src/romini"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["romini"]
omit = ["**/test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = ".venv/bin/python -m build --sdist --wheel"
tag_format = "v{version}"
commit_message = "chore(release): {version}"
allow_zero_version = true

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]

[tool.semantic_release.remote]
type = "github"
