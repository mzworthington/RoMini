[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "romini"
version = "0.1.0"
description = "RoMini — a magic storyteller built for Romy"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
romini = "romini.app:main"

[tool.setuptools]
packages = ["romini"]

[tool.setuptools.package-data]
romini = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
